<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="How it works: name a target, the skill reads the method, measures past runs from local transcripts, and writes one report."><rect width="1200" height="300" rx="16" fill="#0d1117"/><rect x="30" y="50" width="252" height="190" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><circle cx="70" cy="94" r="16" fill="#12302a"/><text x="70" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#4cc9a8">1</text><text x="54" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#e6edf3">Name a target</text><text x="54" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9198a1">a routine, a skill,</text><text x="54" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9198a1">a folder or a process</text><path d="M290 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="326" y="50" width="252" height="190" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><circle cx="366" cy="94" r="16" fill="#12302a"/><text x="366" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#4cc9a8">2</text><text x="350" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#e6edf3">Read the method</text><text x="350" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9198a1">METHOD.md, step</text><text x="350" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9198a1">by step, every run</text><path d="M586 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="622" y="50" width="252" height="190" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><circle cx="662" cy="94" r="16" fill="#12302a"/><text x="662" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#4cc9a8">3</text><text x="646" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#e6edf3">Measure the runs</text><text x="646" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9198a1">your local transcripts,</text><text x="646" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9198a1">read by reader/mede.py</text><path d="M882 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="918" y="50" width="252" height="190" rx="12" fill="#161b22" stroke="#4cc9a8" stroke-width="2"/><circle cx="958" cy="94" r="16" fill="#12302a"/><text x="958" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#4cc9a8">4</text><text x="942" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#e6edf3">Get one report</text><text x="942" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9198a1">per step: AI, person or</text><text x="942" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9198a1">code, with gains and costs</text><text x="600.0" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9198a1">Reads only. The report is the one file it writes. Nothing leaves your machine.</text></svg>
