<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d"><title id="t">How harness-review works</title><desc id="d">Name a target, the skill reads the method, measures past runs from local transcripts, and writes one report.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes on0{0%,0%{opacity:0}3%,20%{opacity:1}23%,100%{opacity:0}}.on0{opacity:0;animation:on0 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes go0{0%,18%{opacity:0;transform:translateX(-10px)}22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateX(6px)}}.go0{opacity:0;animation:go0 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes on1{0%,24%{opacity:0}27%,44%{opacity:1}47%,100%{opacity:0}}.on1{opacity:0;animation:on1 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes go1{0%,42%{opacity:0;transform:translateX(-10px)}46%{opacity:1;transform:none}50%,100%{opacity:0;transform:translateX(6px)}}.go1{opacity:0;animation:go1 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes on2{0%,48%{opacity:0}51%,68%{opacity:1}71%,100%{opacity:0}}.on2{opacity:0;animation:on2 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes go2{0%,66%{opacity:0;transform:translateX(-10px)}70%{opacity:1;transform:none}74%,100%{opacity:0;transform:translateX(6px)}}.go2{opacity:0;animation:go2 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes on3{0%,72%{opacity:0}75%,96%{opacity:1}100%{opacity:0}}.on3{animation:on3 8s cubic-bezier(.23,1,.32,1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="1199" height="299" rx="16" fill="#ffffff" stroke="#d0d7de"/><rect x="30" y="50" width="252" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><g class="on0"><rect x="30" y="50" width="252" height="190" rx="12" fill="#0a6e5c" fill-opacity=".05" stroke="#0a6e5c" stroke-width="2"/></g><circle cx="70" cy="94" r="16" fill="#e3f4ef"/><text x="70" y="100" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#0a6e5c">1</text><text x="54" y="152" font-size="23" font-weight="600" fill="#1f2328">Name a target</text><text x="54" y="186" font-size="17" fill="#59636e">a routine, a skill,</text><text x="54" y="210" font-size="17" fill="#59636e">a folder or a process</text><path d="M290 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="go0"><path d="M290 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#0a6e5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="326" y="50" width="252" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><g class="on1"><rect x="326" y="50" width="252" height="190" rx="12" fill="#0a6e5c" fill-opacity=".05" stroke="#0a6e5c" stroke-width="2"/></g><circle cx="366" cy="94" r="16" fill="#e3f4ef"/><text x="366" y="100" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#0a6e5c">2</text><text x="350" y="152" font-size="23" font-weight="600" fill="#1f2328">Read the method</text><text x="350" y="186" font-size="17" fill="#59636e">METHOD.md, step</text><text x="350" y="210" font-size="17" fill="#59636e">by step, every run</text><path d="M586 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="go1"><path d="M586 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#0a6e5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="622" y="50" width="252" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><g class="on2"><rect x="622" y="50" width="252" height="190" rx="12" fill="#0a6e5c" fill-opacity=".05" stroke="#0a6e5c" stroke-width="2"/></g><circle cx="662" cy="94" r="16" fill="#e3f4ef"/><text x="662" y="100" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#0a6e5c">3</text><text x="646" y="152" font-size="23" font-weight="600" fill="#1f2328">Measure the runs</text><text x="646" y="186" font-size="17" fill="#59636e">your local transcripts,</text><text x="646" y="210" font-size="17" fill="#59636e">read by reader/mede.py</text><path d="M882 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="go2"><path d="M882 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#0a6e5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="918" y="50" width="252" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><g class="on3"><rect x="918" y="50" width="252" height="190" rx="12" fill="#0a6e5c" fill-opacity=".05" stroke="#0a6e5c" stroke-width="2"/></g><circle cx="958" cy="94" r="16" fill="#e3f4ef"/><text x="958" y="100" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#0a6e5c">4</text><text x="942" y="152" font-size="23" font-weight="600" fill="#1f2328">Get one report</text><text x="942" y="186" font-size="17" fill="#59636e">per step: AI, person or</text><text x="942" y="210" font-size="17" fill="#59636e">code, with gains and costs</text><text x="600.0" y="278" text-anchor="middle" font-size="16" fill="#59636e">Reads only. The report is the one file it writes. Nothing leaves your machine.</text></svg>
