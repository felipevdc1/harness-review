<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="How it works: name a target, the skill reads the method, measures past runs from local transcripts, and writes one report."><rect width="1200" height="300" rx="16" fill="#ffffff"/><rect x="30" y="50" width="252" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><circle cx="70" cy="94" r="16" fill="#e3f4ef"/><text x="70" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0a6e5c">1</text><text x="54" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1f2328">Name a target</text><text x="54" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">a routine, a skill,</text><text x="54" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">a folder or a process</text><path d="M290 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="326" y="50" width="252" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><circle cx="366" cy="94" r="16" fill="#e3f4ef"/><text x="366" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0a6e5c">2</text><text x="350" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1f2328">Read the method</text><text x="350" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">METHOD.md, step</text><text x="350" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">by step, every run</text><path d="M586 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="622" y="50" width="252" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><circle cx="662" cy="94" r="16" fill="#e3f4ef"/><text x="662" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0a6e5c">3</text><text x="646" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1f2328">Measure the runs</text><text x="646" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">your local transcripts,</text><text x="646" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">read by reader/mede.py</text><path d="M882 145.0 h28 m-8 -7 l8 7 l-8 7" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="918" y="50" width="252" height="190" rx="12" fill="#f6f8fa" stroke="#0a6e5c" stroke-width="2"/><circle cx="958" cy="94" r="16" fill="#e3f4ef"/><text x="958" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0a6e5c">4</text><text x="942" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1f2328">Get one report</text><text x="942" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">per step: AI, person or</text><text x="942" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">code, with gains and costs</text><text x="600.0" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#59636e">Reads only. The report is the one file it writes. Nothing leaves your machine.</text></svg>
