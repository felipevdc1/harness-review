<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d"><title id="t">A harness-review report</title><desc id="d">An excerpt of a report table: step, today, should be, evidence, saves or loses. Illustrative numbers.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.poster{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-.02em}.m{fill:#565a6e}.cd{fill:#2340d0}@keyframes rmfade{from{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.root{animation:rmfade .8s ease-out both!important}}</style><defs><radialGradient id="glow" cx="92%" cy="0%" r="80%"><stop offset="0" stop-color="#2340d0" stop-opacity=".10"/><stop offset="1" stop-color="#2340d0" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#a3166f" stop-opacity=".06"/><stop offset="1" stop-color="#a3166f" stop-opacity="0"/></radialGradient></defs><g class="root" fill="#15172b"><rect x=".5" y=".5" width="959" height="519" rx="22" fill="#fbfaf7" stroke="#dcd8ce"/><rect x=".5" y=".5" width="959" height="519" rx="22" fill="url(#glow)"/><rect x=".5" y=".5" width="959" height="519" rx="22" fill="url(#glow2)"/><text x="40" y="58" class="mono cd" font-size="16" font-weight="700" letter-spacing="1.5">WHAT YOU GET</text><text x="920" y="58" text-anchor="end" class="mono m" font-size="15">illustrative numbers</text><text x="40" y="102" class="poster" font-size="34">One report, a verdict per step.</text><text x="40" y="136" class="mono m" font-size="16">harness-reviews/&lt;date&gt;-daily-digest.md</text><text x="56" y="184" text-anchor="start" class="mono m" font-size="13" letter-spacing="1.5">STEP</text><text x="340" y="184" text-anchor="middle" class="mono m" font-size="13" letter-spacing="1.5">TODAY</text><text x="434" y="184" text-anchor="middle" class="mono m" font-size="13" letter-spacing="1.5">SHOULD BE</text><text x="496" y="184" text-anchor="start" class="mono m" font-size="13" letter-spacing="1.5">EVIDENCE</text><text x="690" y="184" text-anchor="start" class="mono m" font-size="13" letter-spacing="1.5">SAVES · LOSES</text><line x1="32" y1="198" x2="928" y2="198" stroke="#dcd8ce"/><text x="56" y="242.0" font-size="18" font-weight="400">Read inbox.json</text><g><rect x="299.0" y="222.0" width="82" height="28" rx="14.0" fill="#e5e9ff"/><text x="340" y="241.4" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#2340d0">code</text></g><g><rect x="393.0" y="222.0" width="82" height="28" rx="14.0" fill="#e5e9ff"/><text x="434" y="241.4" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#2340d0">code</text></g><text x="496" y="242.0" font-size="16" class="m">already code</text><text x="690" y="242.0" font-size="15" class="m">—</text><rect x="32" y="270" width="896" height="52" rx="12" fill="#e5e9ff"/><text x="56" y="302.0" font-size="18" font-weight="700">Sort items by priority</text><g><rect x="299.0" y="282.0" width="82" height="28" rx="14.0" fill="#fae6f2"/><text x="340" y="301.4" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#a3166f">AI</text></g><rect x="393.0" y="282.0" width="82" height="28" rx="14.0" fill="#2340d0"/><text x="434" y="301.4" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#ffffff">code</text><text x="496" y="302.0" font-size="16">same field in 7 of 7</text><text x="690" y="302.0" font-size="15" font-weight="700" class="cd">saves 3.8k tokens / run</text><line x1="32" y1="326" x2="928" y2="326" stroke="#dcd8ce" stroke-opacity=".7"/><text x="56" y="362.0" font-size="18" font-weight="400">Write the summary</text><g><rect x="299.0" y="342.0" width="82" height="28" rx="14.0" fill="#fae6f2"/><text x="340" y="361.4" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#a3166f">AI</text></g><g><rect x="393.0" y="342.0" width="82" height="28" rx="14.0" fill="#fae6f2"/><text x="434" y="361.4" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#a3166f">AI</text></g><text x="496" y="362.0" font-size="16" class="m">wording differs daily</text><text x="690" y="362.0" font-size="15" class="m">keeps the judgment</text><line x1="32" y1="386" x2="928" y2="386" stroke="#dcd8ce" stroke-opacity=".7"/><text x="56" y="422.0" font-size="18" font-weight="400">Choose what to publish</text><g><rect x="299.0" y="402.0" width="82" height="28" rx="14.0" fill="#f3ead2"/><text x="340" y="421.4" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#6f5410">person</text></g><g><rect x="393.0" y="402.0" width="82" height="28" rx="14.0" fill="#f3ead2"/><text x="434" y="421.4" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#6f5410">person</text></g><text x="496" y="422.0" font-size="16" class="m">your call, every day</text><text x="690" y="422.0" font-size="15" class="m">stays with you</text><text x="56" y="490" font-size="16" class="m">Each step that should be code also gets a test that fails today.</text></g></svg>
