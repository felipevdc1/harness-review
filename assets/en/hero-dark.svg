<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 638" width="960" height="638" role="img" aria-labelledby="t d"><title id="t">A review of a four-step routine</title><desc id="d">Each step is marked AI, person or code, today and after the review. After measuring past runs, sorting items by priority moves from AI to code. Illustrative numbers.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.poster{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-.02em}.m{fill:#9ca1ba}.cd{fill:#93a6ff}@keyframes rmfade{from{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.root{animation:rmfade .8s ease-out both!important}}@keyframes scan{0%{opacity:0;transform:translateY(0)}2%,8%{opacity:1;transform:translateY(0)}11%,35%{opacity:1;transform:translateY(62px)}38%,43%{opacity:1;transform:translateY(124px)}46%,52%{opacity:1;transform:translateY(186px)}55%,100%{opacity:0;transform:translateY(186px)}}.scan{opacity:0;animation:scan 14s cubic-bezier(.77,0,.175,1) infinite}@keyframes busy{0%{opacity:0}2%,52%{opacity:1}54%,100%{opacity:0}}.busy{opacity:0;animation:busy 14s cubic-bezier(.23,1,.32,1) infinite}@keyframes verdict{0%,53%{opacity:0}56%,97%{opacity:1}100%{opacity:0}}.verdict{animation:verdict 14s cubic-bezier(.23,1,.32,1) infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes reading{0%{opacity:0}2%,14%{opacity:1}16%,100%{opacity:0}}.reading{opacity:0;animation:reading 14s cubic-bezier(.23,1,.32,1) infinite}@keyframes sub{0%,10%{opacity:0}13%,97%{opacity:1}100%{opacity:0}}.sub{animation:sub 14s cubic-bezier(.23,1,.32,1) infinite}@keyframes ev1{0%,14%{opacity:0;transform:translateY(6px)}17%,97%{opacity:1;transform:none}100%{opacity:0;transform:none}}.ev1