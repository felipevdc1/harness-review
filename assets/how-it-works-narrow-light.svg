<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 926" width="600" height="926" role="img" aria-labelledby="t d"><title id="t">How harness-review works</title><desc id="d">Name a target, the skill reads the method, measures past runs from local transcripts, and writes one report.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.poster{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-.02em}.m{fill:#565a6e}.cd{fill:#2340d0}@keyframes rmfade{from{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.root{animation:rmfade .8s ease-out both!important}}@keyframes on0{0%,0%{opacity:0}3%,20%{opacity:1}24%,100%{opacity:0}}.on0{opacity:0;animation:on0 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes go0{0%,18%{opacity:0;transform:translateY(-10px)}22%{opacity:1;transform:none}27%,100%{opacity:0;transform:translateY(6px)}}.go0{opacity:0;animation:go0 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes on1{0%,22%{opacity:0}25%,42%{opacity:1}46%,100%{opacity:0}}.on1{opacity:0;animation:on1 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes go1{0%,40%{opacity:0;transform:translateY(-10px)}44%{opacity:1;transform:none}49%,100%{opacity:0;transform:translateY(6px)}}.go1{opacity:0;animation:go1 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes on2{0%,44%{opacity:0}47%,64%{opacity:1}68%,100%{opacity:0}}.on2{opacity:0;animation:on2 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes go2{0%,62%{opacity:0;transform:translateY(-10px)}66%{opacity:1;transform:none}71%,100%{opacity:0;transform:translateY(6px)}}.go2{opacity:0;animation:go2 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes on3{0%,66%{opacity:0}69%,97%{opacity:1}100%{opacity:0}}.on3{animation:on3 8s cubic-bezier(.23,1,.32,1) infinite}</style><defs><radialGradient id="glow" cx="92%" cy="0%" r="80%"><stop offset="0" stop-color="#2340d0" stop-opacity=".10"/><stop offset="1" stop-color="#2340d0" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#a3166f" stop-opacity=".06"/><stop offset="1" stop-color="#a3166f" stop-opacity="0"/></radialGradient></defs><g class="root" fill="#15172b"><rect x=".5" y=".5" width="599" height="925" rx="22" fill="#fbfaf7" stroke="#dcd8ce"/><rect x=".5" y=".5" width="599" height="925" rx="22" fill="url(#glow)"/><rect x=".5" y=".5" width="599" height="925" rx="22" fill="url(#glow2)"/><rect x="32" y="32" width="536" height="156" rx="14" fill="#f3f1ec" stroke="#dcd8ce"/><g class="on0"><rect x="32" y="32" width="536" height="156" rx="14" fill="#2340d0" fill-opacity=".06" stroke="#2340d0" stroke-width="2"/></g><text x="62" y="102" class="poster" font-size="52" fill="#2340d0">1</text><text x="128" y="84" font-size="30" font-weight="700">Name a target</text><text x="128" y="122" font-size="26" class="m">a routine, a skill,</text><text x="128" y="156" font-size="26" class="m">a folder or a process</text><path d="M300.0 196 v24 m-7 -8 l7 8 l7 -8" stroke="#565a6e" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><g class="go0"><path d="M300.0 196 v24 m-7 -8 l7 8 l7 -8" stroke="#2340d0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.75"/></g><rect x="32" y="228" width="536" height="156" rx="14" fill="#f3f1ec" stroke="#dcd8ce"/><g class="on1"><rect x="32" y="228" width="536" height="156" rx="14" fill="#2340d0" fill-opacity=".06" stroke="#2340d0" stroke-width="2"/></g><text x="62" y="298" class="poster" font-size="52" fill="#2340d0">2</text><text x="128" y="280" font-size="30" font-weight="700">Read the method</text><text x="128" y="318" font-size="26" class="m">METHOD.md, step</text><text x="128" y="352" font-size="26" class="m">by step, every run</text><path d="M300.0 392 v24 m-7 -8 l7 8 l7 -8" stroke="#565a6e" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><g class="go1"><path d="M300.0 392 v24 m-7 -8 l7 8 l7 -8" stroke="#2340d0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.75"/></g><rect x="32" y="424" width="536" height="156" rx="14" fill="#f3f1ec" stroke="#dcd8ce"/><g class="on2"><rect x="32" y="424" width="536" height="156" rx="14" fill="#2340d0" fill-opacity=".06" stroke="#2340d0" stroke-width="2"/></g><text x="62" y="494" class="poster" font-size="52" fill="#2340d0">3</text><text x="128" y="476" font-size="30" font-weight="700">Measure the runs</text><text x="128" y="514" font-size="26" class="m">your local transcripts,</text><text x="128" y="548" font-size="26" class="m">read by reader/mede.py</text><path d="M300.0 588 v24 m-7 -8 l7 8 l7 -8" stroke="#565a6e" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><g class="go2"><path d="M300.0 588 v24 m-7 -8 l7 8 l7 -8" stroke="#2340d0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.75"/></g><rect x="32" y="620" width="536" height="156" rx="14" fill="#f3f1ec" stroke="#dcd8ce"/><g class="on3"><rect x="32" y="620" width="536" height="156" rx="14" fill="#2340d0" fill-opacity=".06" stroke="#2340d0" stroke-width="2"/></g><text x="62" y="690" class="poster" font-size="52" fill="#2340d0">4</text><text x="128" y="672" font-size="30" font-weight="700">Get one report</text><text x="128" y="710" font-size="26" class="m">per step: AI, person or</text><text x="128" y="744" font-size="26" class="m">code, with gains and costs</text><text x="300.0" y="826" text-anchor="middle" font-size="26" class="m">Reads only.</text><text x="300.0" y="862" text-anchor="middle" font-size="26" class="m">The report is the one file it writes.</text><text x="300.0" y="898" text-anchor="middle" font-size="26" class="m">Nothing leaves your machine.</text></g></svg>
