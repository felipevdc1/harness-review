<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d"><title id="t">harness-review</title><desc id="d">A review of a four-step routine. Each step is marked AI, person or code, today and after the review. After measuring past runs, sorting items by priority moves from AI to code. Illustrative numbers.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes scene{0%{opacity:0}3%,96%{opacity:1}100%{opacity:0}}.scene{animation:scene 12s linear infinite}@keyframes scan{0%,4%{opacity:0;transform:translateY(0)}6%,12%{opacity:1;transform:translateY(0)}15%,54%{opacity:1;transform:translateY(64px)}57%,64%{opacity:1;transform:translateY(128px)}67%,76%{opacity:1;transform:translateY(192px)}79%,100%{opacity:0;transform:translateY(192px)}}.scan{opacity:0;animation:scan 12s cubic-bezier(.77,0,.175,1) infinite}@keyframes busy{0%,3%{opacity:0}5%,77%{opacity:1}79%,100%{opacity:0}}.busy{opacity:0;animation:busy 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes verdict{0%,79%{opacity:0;transform:translateY(0px)}82%,100%{opacity:1;transform:none}}.verdict{animation:verdict 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes reading{0%,4%{opacity:0}6%,19%{opacity:1}21%,100%{opacity:0}}.reading{opacity:0;animation:reading 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes ev1{0%,21%{opacity:0;transform:translateY(6px)}24%,100%{opacity:1;transform:none}}.ev1{animation:ev1 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes ev2{0%,24%{opacity:0;transform:translateY(6px)}27%,100%{opacity:1;transform:none}}.ev2{animation:ev2 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes ev3{0%,27%{opacity:0;transform:translateY(6px)}30%,100%{opacity:1;transform:none}}.ev3{animation:ev3 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes ev4{0%,33%{opacity:0;transform:translateY(6px)}36%,100%{opacity:1;transform:none}}.ev4{animation:ev4 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes outgo{0%,17%{opacity:0;transform:translateY(6px)}20%,39%{opacity:1;transform:none}43%,100%{opacity:0;transform:translateY(-10px)}}.outgo{opacity:0;animation:outgo 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes income{0%,40%{opacity:0;transform:translateY(10px)}44%,100%{opacity:1;transform:none}}.income{animation:income 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes lit{0%,41%{opacity:0;transform:translateY(0px)}44%,100%{opacity:1;transform:none}}.lit{animation:lit 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes r0{0%,9%{opacity:0;transform:translateY(6px)}12%,100%{opacity:1;transform:none}}.r0{animation:r0 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes c0{0%,11%{opacity:0;transform:translateY(0px)}14%,100%{opacity:1;transform:none}}.c0{animation:c0 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes r1{0%,17%{opacity:0;transform:translateY(0px)}20%,100%{opacity:1;transform:none}}.r1{animation:r1 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes c1{0%,48%{opacity:0;transform:translateY(0px)}51%,100%{opacity:1;transform:none}}.c1{animation:c1 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes r2{0%,61%{opacity:0;transform:translateY(6px)}64%,100%{opacity:1;transform:none}}.r2{animation:r2 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes c2{0%,63%{opacity:0;transform:translateY(0px)}66%,100%{opacity:1;transform:none}}.c2{animation:c2 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes r3{0%,71%{opacity:0;transform:translateY(6px)}74%,100%{opacity:1;transform:none}}.r3{animation:r3 12s cubic-bezier(.23,1,.32,1) infinite}@keyframes c3{0%,73%{opacity:0;transform:translateY(0px)}76%,100%{opacity:1;transform:none}}.c3{animation:c3 12s cubic-bezier(.23,1,.32,1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id=