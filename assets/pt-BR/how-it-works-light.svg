<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d"><title id="t">Como a harness-review funciona</title><desc id="d">Você nomeia um alvo, a skill lê o método, mede as execuções passadas nas transcrições locais e escreve um relatório.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.poster{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-.02em}.m{fill:#565a6e}.cd{fill:#2340d0}@keyframes rmfade{from{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.root{animation:rmfade .8s ease-out both!important}}@keyframes on0{0%,0%{opacity:0}3%,20%{opacity:1}24%,100%{opacity:0}}.on0{opacity:0;animation:on0 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes go0{0%,18%{opacity:0;transform:translateX(-10px)}22%{opacity:1;transform:none}27%,100%{opacity:0;transform:translateX(6px)}}.go0{opacity:0;animation:go0 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes on1{0%,22%{opacity:0}25%,42%{opacity:1}46%,100%{opacity:0}}.on1{opacity:0;animation:on1 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes go1{0%,40%{opacity:0;transform:translateX(-10px)}44%{opacity:1;transform:none}49%,100%{opacity:0;transform:translateX(6px)}}.go1{opacity:0;animation:go1 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes on2{0%,44%{opacity:0}47%,64%{opacity:1}68%,100%{opacity:0}}.on2{opacity:0;animation:on2 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes go2{0%,62%{opacity:0;transform:translateX(-10px)}66%{opacity:1;transform:none}71%,100%{opacity:0;transform:translateX(6px)}}.go2{opacity:0;animation:go2 8s cubic-bezier(.23,1,.32,1) infinite}@keyframes on3{0%,66%{opacity:0}69%,97%{opacity:1}100%{opacity:0}}.on3{animation:on3 8s cubic-bezier(.23,1,.32,1) infinite}</style><defs><radialGradient id="glow" cx="92%" cy="0%" r="80%"><stop offset="0" stop-color="#2340d0" stop-opacity=".10"/><stop offset="1" stop-color="#2340d0" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#a3166f" stop-opacity=".06"/><stop offset="1" stop-color="#a3166f" stop-opacity="0"/></radialGradient></defs><g class="root" fill="#15172b"><rect x=".5" y=".5" width="1199" height="339" rx="22" fill="#fbfaf7" stroke="#dcd8ce"/><rect x=".5" y=".5" width="1199" height="339" rx="22" fill="url(#glow)"/><rect x=".5" y=".5" width="1199" height="339" rx="22" fill="url(#glow2)"/><rect x="32" y="40" width="258" height="200" rx="14" fill="#f3f1ec" stroke="#dcd8ce"/><g class="on0"><rect x="32" y="40" width="258" height="200" rx="14" fill="#2340d0" fill-opacity=".06" stroke="#2340d0" stroke-width="2"/></g><text x="56" y="102" class="poster" font-size="46" fill="#2340d0">1</text><text x="56" y="152" font-size="22" font-weight="700">Nomeie um alvo</text><text x="56" y="186" font-size="17" class="m">uma rotina, uma skill,</text><text x="56" y="211" font-size="17" class="m">uma pasta ou um processo</text><path d="M296 140.0 h26 m-8 -7 l8 7 l-8 7" stroke="#565a6e" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><g class="go0"><path d="M296 140.0 h26 m-8 -7 l8 7 l-8 7" stroke="#2340d0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.75"/></g><rect x="328" y="40" width="258" height="200" rx="14" fill="#f3f1ec" stroke="#dcd8ce"/><g class="on1"><rect x="328" y="40" width="258" height="200" rx="14" fill="#2340d0" fill-opacity=".06" stroke="#2340d0" stroke-width="2"/></g><text x="352" y="102" class="poster" font-size="46" fill="#2340d0">2</text><text x="352" y="152" font-size="22" font-weight="700">Lê o método</text><text x="352" y="186" font-size="17" class="m">METHOD.md, passo</text><text x="352" y="211" font-size="17" class="m">a passo, toda vez</text><path d="M592 140.0 h26 m-8 -7 l8 7 l-8 7" stroke="#565a6e" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><g class="go1"><path d="M592 140.0 h26 m-8 -7 l8 7 l-8 7" stroke="#2340d0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.75"/></g><rect x="624" y="40" width="258" height="200" rx="14" fill="#f3f1ec" stroke="#dcd8ce"/><g class="on2"><rect x="624" y="40" width="258" height="200" rx="14" fill="#2340d0" fill-opacity=".06" stroke="#2340d0" stroke-width="2"/></g><text x="648" y="102" class="poster" font-size="46" fill="#2340d0">3</text><text x="648" y="152" font-size="22" font-weight="700">Mede as execuções</text><text x="648" y="186" font-size="17" class="m">suas transcrições locais,</text><text x="648" y="211" font-size="17" class="m">lidas por reader/mede.py</text><path d="M888 140.0 h26 m-8 -7 l8 7 l-8 7" stroke="#565a6e" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><g class="go2"><path d="M888 140.0 h26 m-8 -7 l8 7 l-8 7" stroke="#2340d0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.75"/></g><rect x="920" y="40" width="258" height="200" rx="14" fill="#f3f1ec" stroke="#dcd8ce"/><g class="on3"><rect x="920" y="40" width="258" height="200" rx="14" fill="#2340d0" fill-opacity=".06" stroke="#2340d0" stroke-width="2"/></g><text x="944" y="102" class="poster" font-size="46" fill="#2340d0">4</text><text x="944" y="152" font-size="22" font-weight="700">Um relatório</text><text x="944" y="186" font-size="17" class="m">por passo: IA, pessoa</text><text x="944" y="211" font-size="17" class="m">ou código, ganho e custo</text><text x="600.0" y="306" text-anchor="middle" font-size="21" class="m">Só lê. O único arquivo que escreve é o relatório. Nada sai da sua máquina.</text></g></svg>
