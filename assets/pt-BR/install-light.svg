<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">Instalar a harness-review</title><desc id="d">Cole um pedido no Claude Code: ele adiciona o marketplace de plugins, instala o plugin e pede para reiniciar.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.poster{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-.02em}.m{fill:#565a6e}.cd{fill:#2340d0}@keyframes rmfade{from{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.root{animation:rmfade .8s ease-out both!important}}@keyframes l0{0%,6%{opacity:.35}9%,97%{opacity:1}100%{opacity:.35}}.l0{animation:l0 10s cubic-bezier(.23,1,.32,1) infinite}@keyframes l1{0%,16%{opacity:.35}19%,97%{opacity:1}100%{opacity:.35}}.l1{animation:l1 10s cubic-bezier(.23,1,.32,1) infinite}@keyframes l2{0%,26%{opacity:.35}29%,97%{opacity:1}100%{opacity:.35}}.l2{animation:l2 10s cubic-bezier(.23,1,.32,1) infinite}@keyframes l3{0%,36%{opacity:.35}39%,97%{opacity:1}100%{opacity:.35}}.l3{animation:l3 10s cubic-bezier(.23,1,.32,1) infinite}@keyframes l4{0%,46%{opacity:.35}49%,97%{opacity:1}100%{opacity:.35}}.l4{animation:l4 10s cubic-bezier(.23,1,.32,1) infinite}</style><defs><radialGradient id="glow" cx="92%" cy="0%" r="80%"><stop offset="0" stop-color="#2340d0" stop-opacity=".10"/><stop offset="1" stop-color="#2340d0" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#a3166f" stop-opacity=".06"/><stop offset="1" stop-color="#a3166f" stop-opacity="0"/></radialGradient></defs><g class="root" fill="#15172b"><rect x=".5" y=".5" width="759" height="359" rx="22" fill="#fbfaf7" stroke="#dcd8ce"/><rect x=".5" y=".5" width="759" height="359" rx="22" fill="url(#glow)"/><rect x=".5" y=".5" width="759" height="359" rx="22" fill="url(#glow2)"/><text x="40" y="58" class="mono cd" font-size="16" font-weight="700" letter-spacing="1.5">INSTALAR</text><text x="40" y="100" class="poster" font-size="34">Um pedido. Um reinício.</text><rect x="32" y="128" width="696" height="200" rx="14" fill="#f3f1ec" stroke="#dcd8ce"/><text x="56" y="158" class="mono m" font-size="14">Claude Code</text><line x1="32" y1="172" x2="728" y2="172" stroke="#dcd8ce"/><g class="l0"><text x="56" y="204" class="mono" font-size="18" font-weight="700" fill="#565a6e">❯</text><text x="84" y="204" class="mono" font-size="18" fill="#15172b">cole o pedido de instalação</text></g><g class="l1"><text x="56" y="232" class="mono" font-size="18" font-weight="700" fill="#2340d0">✓</text><text x="84" y="232" class="mono" font-size="18" fill="#15172b">/plugin marketplace add</text></g><g class="l2"><text x="56" y="260" class="mono" font-size="18" font-weight="700" fill="#2340d0">✓</text><text x="84" y="260" class="mono" font-size="18" fill="#15172b">/plugin install harness-review@harness-review</text></g><g class="l3"><text x="56" y="288" class="mono" font-size="18" font-weight="700" fill="#a3166f">↻</text><text x="84" y="288" class="mono" font-size="18" fill="#15172b">reinicie o Claude Code e peça:</text></g><g class="l4"><text x="56" y="316" class="mono" font-size="18" font-weight="700" fill="#15172b"></text><text x="84" y="316" class="mono" font-size="18" fill="#2340d0">“revisa minha rotina: o que devia ser código?”</text></g></g></svg>
