<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d"><title id="t">Um relatório da harness-review</title><desc id="d">Trecho da tabela de um relatório: passo, hoje, devia ser, evidência, ganha ou perde. Números ilustrativos.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.poster{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-.02em}.m{fill:#565a6e}.cd{fill:#2340d0}@keyframes rmfade{from{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.root{animation:rmfade .8s ease-out both!important}}</style><defs><radialGradient id="glow" cx="92%" cy="0%" r="80%"><stop offset="0" stop-color="#2340d0" stop-opacity=".10"/><stop offset="1" stop-color="#2340d0" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#a3166f" stop-opacity=".06"/><stop offset="1" stop-color="#a3166f" stop-opacity="0"/></radialGradient></defs><g class="root" fill="#15172b"><rect x=".5" y=".5" width="959" height="519" rx="22" fill="#fbfaf7" stroke="#dcd8ce"/><rect x=".5" y=".5" width="959" height="519" rx="22" fill="url(#glow)"/><rect x=".5" y=".5" width="959" height="519" rx="22" fill="url(#glow2)"/><text x="40" y="58" class="mono cd" font-size="16" font-weight="700" letter-spacing="1.5">O QUE VOCÊ RECEBE</text><text x="920" y="58" text-anchor="end" class="mono m" font-size="15">números ilustrativos</text><text x="40" y="102" class="poster" font-size="34">Um relatório, um veredito por passo.</text><text x="40" y="136" class="mono m" font-size="16">harness-reviews/&lt;data&gt;-daily-digest.md</text><text x="56" y="184" text-anchor="start" class="mono m" font-size="13" letter-spacing="1.5">PASSO</text><text x="340" y=